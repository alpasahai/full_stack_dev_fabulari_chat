<div class="signup-page page-frame">
  <div class="signup-card card">
    <h1>SIGN UP</h1>

    <form #signupForm="ngForm" (ngSubmit)="onSubmit(signupForm)">
      <label>
        Username
        <input type="text" [(ngModel)]="username" name="username" required>
      </label>

      <label>
        Email
        <input type="email" [(ngModel)]="email" name="email" required>
      </label>

      <label>
        Password
        <input type="password" [(ngModel)]="password" name="password" required minlength="6">
      </label>

      <label>
        Date of Birth
        <input type="date" [(ngModel)]="dob" name="dob">
      </label>

      <label>
        Profile Picture
      </label>
        <button type="button" disabled>Upload PFP</button>

        <h3>Chat Theme</h3>
        <p>Select a colour for your chat background</p>
        <div class="theme-options">
          <button type="button" disabled class="theme-circle theme-1"></button>
          <button type="button" disabled class="theme-circle theme-2"></button>
          <button type="button" disabled class="theme-circle theme-3"></button>
          <button type="button" disabled class="theme-circle theme-4"></button>
        </div>

      <p class="error" *ngIf="error_message">{{ error_message }}</p>

      <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>
    </form>

    <a routerLink="/login" class="back-link">Been here before? Login!</a>
  </div>
</div>
