<div class="login-page page-frame">
  <div class="login-card card">
    <h1>Login Page</h1>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
      <label>
        Username
        <input type="text" [(ngModel)]="username" name="username" required autofocus>
      </label>

      <label>
        Password
        <input type="password" [(ngModel)]="password" name="password" required>
      </label>

      <p class="error" *ngIf="error_message">{{ error_message }}</p>

      <button type="submit" [disabled]="loginForm.invalid">Login</button>

      <a routerLink="/signup" class="signup-link">Don't wanna miss the fun? Sign up</a>
    </form>
  </div>
</div>
